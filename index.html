function replayTeam(){
  document.querySelectorAll(".post-btns-wrap").forEach(e=>e.remove());
  if(!teamSel.length){openTeamSelect();return;}
  let avail=teamSel.filter(id=>found.includes(id));
  if(!avail.length){openTeamSelect();return;}
  let team=avail.map(id=>{
    let ex=roster.find(p=>p.id===id)||storage.find(p=>p.id===id);
    let p=ex?JSON.parse(JSON.stringify(ex)):makePoke(id,minLevel(id));
    p.hp=p.maxHp;return p;
  });
  hideResultScreen();startBattle(team);
}

function hideBattle(){document.getElementById("battleSection").style.display="none";}

// ══════════════════════════════════════════════
// CAPTURE
// ══════════════════════════════════════════════
function pokeRarity(id){
  if([144,145,146,150,151].includes(id))return 3;
  if([130,131,132,137,142,143,149].includes(id))return 2.5;
  if(id>=100)return 2;if(id>=50)return 1.5;return 1;
}
function captureRate(poke,ballType){
  let baseRate=1.0-(poke.level/100)*0.7-(pokeRarity(poke.id)-1)*0.2;
  let ballMult=ballType==="hyperball"?3.5:ballType==="superball"?2.0:1.0;
  let hpMult=1+(1-(poke.hp/poke.maxHp))*0.5;
  return Math.min(0.98,Math.max(0.02,baseRate*ballMult*hpMult));
}

function openCapturePanel(){
  let ballTotal=inventory.pokeball+inventory.superball+inventory.hyperball;
  let choix=enemy.map((e,i)=>`
    <div class="selCard" style="display:inline-block;margin:6px;width:120px;vertical-align:top">
      <img src="${getSprite(e.id)}" style="width:52px;image-rendering:pixelated"><br>
      <b style="font-size:9px">${e.name}</b><br>${badge(ptype[e.id-1]||"normal")}<br>
      <span style="color:var(--text2);font-size:9px">Nv.${e.level}</span><br>
      <div style="margin-top:6px;display:flex;flex-direction:column;gap:3px;">
        ${inventory.pokeball>0?`<button class="capture-btn" style="border-color:#e04040;color:#e04040;background:rgba(224,64,64,0.1)" onclick="attemptCapture(${i},'pokeball')">🔴 Pokéball (${inventory.pokeball})</button>`:""}
        ${inventory.superball>0?`<button class="capture-btn" style="border-color:#4080f0;color:#4080f0;background:rgba(64,128,240,0.1)" onclick="attemptCapture(${i},'superball')">🔵 Superball (${inventory.superball})</button>`:""}
        ${inventory.hyperball>0?`<button class="capture-btn" style="border-color:#f0d000;color:#f0d000;background:rgba(240,208,0,0.1)" onclick="attemptCapture(${i},'hyperball')">🟡 Hyperball (${inventory.hyperball})</button>`:""}
      </div>
    </div>`).join("");
  let noBallMsg=ballTotal===0?`<div style="color:var(--red);font-size:11px;margin-bottom:10px">⚠️ Aucune Ball ! Achète en au shop.</div>`:"";
  showOv(`<div style="text-align:center">
    <div style="font-size:36px;margin-bottom:8px">🏆</div>
    <h2 style="color:var(--gold);font-family:var(--font-pixel);font-size:13px;margin-bottom:8px">VICTOIRE !</h2>
    <p style="color:var(--text2);font-size:12px;margin-bottom:6px">Utilise une Ball pour capturer un Pokémon !</p>
    ${noBallMsg}<div>${choix}</div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn" onclick="openShop()">🏪 Acheter des Balls</button>
      <button class="btn" onclick="skipCap()">Passer</button>
    </div>
  </div>`);
}

function attemptCapture(enemyIdx,ballType){
  let e=enemy[enemyIdx];
  if(inventory[ballType]<=0)return;
  inventory[ballType]--;saveAll();
  let rate=captureRate(e,ballType);
  let success=Math.random()<rate;
  let ballEmoji=ballType==="hyperball"?"🟡":ballType==="superball"?"🔵":"🔴";
  hideOv();
  setDialog(`${ballEmoji} Ball lancée sur ${e.name}...`);
  let ball=document.getElementById("ballAnim");
  ball.textContent=ballEmoji;ball.style.display="block";
  ball.style.left="15%";ball.style.top="70%";ball.style.transition="none";
  setTimeout(()=>{ball.style.transition="left 0.5s,top 0.4s";ball.style.left="72%";ball.style.top="15%";},50);
  setTimeout(()=>{
    ball.textContent="💫";
    setTimeout(()=>{
      ball.style.display="none";
      if(success){
        setDialog(`${e.name} a été capturé !`);
        logB(`${e.name} Nv.${e.level} capturé ! (${Math.round(rate*100)}% chance)`,"evo");
        earnMoney(Math.floor(e.level*3*pokeRarity(e.id)),`Capture ${e.name}`);
        doCapture(e);
      } else {
        setDialog(`${e.name} s'est libéré !`);
        logB(`${e.name} s'est libéré de la ${ballEmoji} Ball !`,"ko");
        if(Math.random()<1/64){
          setDialog(`${e.name} s'est enfui !`);
          enemy.splice(enemyIdx,1);
          setTimeout(()=>{if(enemy.length===0){hideOv();postBtns();}else openCapturePanel();},1200);
        } else {setTimeout(()=>openCapturePanel(),1200);}
      }
    },600);
  },700);
}

function doCapture(e){
  let isNew=!found.includes(e.id);
  if(isNew)found.push(e.id);
  let cp=JSON.parse(JSON.stringify(e));
  // Clean mega fields
  if(cp._preMegaType){cp.type=cp._preMegaType;delete cp._preMegaType;}
  if(cp._willMega!==undefined)delete cp._willMega;
  let si=storage.findIndex(s=>s.id===e.id);
  if(si>=0){if(cp.level>storage[si].level)storage[si]=cp;}
  else storage.push(cp);
  logB(`${e.name} Nv.${e.level} envoyé au stockage !`,"lvl");
  saveAll();render();hideOv();
  if(isNew){
    setTimeout(()=>{
      let cell=document.querySelector(`#grid .cell:nth-child(${e.id})`);
      if(cell){cell.style.animation="none";void cell.offsetWidth;cell.style.animation="discoverPop 0.5s ease";}
    },100);
  }
  postBtns();
}
function skipCap(){hideOv();postBtns();}

// ══════════════════════════════════════════════
// SHOP
// ══════════════════════════════════════════════
const SHOP_ITEMS=[
  {id:"pokeball",    name:"Pokéball",     emoji:"🔴", price:50,
   desc:"Taux de capture de base.\nIdéale pour les Niv.1-15.", color:"#e04040"},
  {id:"superball",   name:"Superball",    emoji:"🔵", price:150,
   desc:"Taux x2. Bonne pour\nles Niv.16-35.", color:"#4080f0"},
  {id:"hyperball",   name:"Hyperball",    emoji:"🟡", price:350,
   desc:"Taux x3.5. Nécessaire\npour les Niv.36+.", color:"#f0d000"},
  {id:"potion",      name:"Potion",       emoji:"🧪", price:80,
   desc:"Restaure 20 PV.\nPasse un tour en combat.", color:"#40e080"},
  {id:"superpotion", name:"Super Potion", emoji:"💊", price:180,
   desc:"Restaure 40 PV.\nPasse un tour en combat.", color:"#40c0c0"},
  {id:"hyperpotion", name:"Hyper Potion", emoji:"💉", price:350,
   desc:"Restaure 60 PV.\nPasse un tour en combat.", color:"#c060ff"},
  {id:"megastone",   name:"Méga-gem",  emoji:"💎", price:500,
   desc:"Méga-Évolue un Pokémon\ncompatible en combat.\nEffet : bonus ATK + PV !", color:"#ff80ff"},
];

function openShop(){
  let megaCompatibles=found.filter(id=>MEGA_DATA[id]).map(id=>{let forms=MEGA_DATA[id];return names[id-1]+(forms.length>1?" (X/Y)":"");}).join(", ")||"Aucun trouvé";
  let html=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <h2 style="font-size:15px">🏪 Boutique</h2>
    <div style="font-size:14px;color:var(--gold);font-weight:700">💰 ${money} ₽</div>
  </div>
  <div style="font-size:10px;color:var(--text3);margin-bottom:4px">🔴 ${inventory.pokeball} · 🔵 ${inventory.superball} · 🟡 ${inventory.hyperball} · 🧪 ${inventory.potion} · 💊 ${inventory.superpotion} · 💉 ${inventory.hyperpotion} · 💎 ${inventory.megastone}</div>
  <div style="font-size:10px;color:var(--mega);margin-bottom:12px">💎 Méga compatibles trouvés : ${megaCompatibles}</div>
  <div class="shop-grid">
  ${SHOP_ITEMS.map(item=>`
    <div class="shop-item" style="border-color:${item.color}44">
      <span class="shop-item-img">${item.emoji}</span>
      <div class="shop-item-name" style="color:${item.color}">${item.name}</div>
      <div class="shop-item-desc">${item.desc.replace(/\n/g,"<br>")}</div>
      <div class="shop-item-price">💰 ${item.price} ₽</div>
      <div class="shop-item-stock">Stock : ${inventory[item.id]}</div>
      <button class="shop-buy-btn" ${money<item.price?"disabled":""} onclick="buyItem('${item.id}')" style="border-color:${item.color};color:${item.color}">Acheter</button>
    </div>
  `).join("")}
  </div>
  <div style="text-align:center;margin-top:16px"><button class="btn" onclick="hideOv()">Fermer</button></div>`;
  showOv(html);
}

function buyItem(itemId){
  let item=SHOP_ITEMS.find(i=>i.id===itemId);
  if(!item||money<item.price)return;
  money-=item.price;
  inventory[itemId]=(inventory[itemId]||0)+1;
  saveAll();
  document.getElementById("moneySpan").textContent=money;
  showMoneyToast(`-${item.price} ₽`,"#ff8800");
  openShop();
}

    @keyframes evoSpin{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
    @keyframes resultPop{0%{transform:scale(0.4) translateY(60px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
